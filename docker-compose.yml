services:
  postgres:
    image: postgres:17-alpine
    container_name: vientos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vientos
      POSTGRES_PASSWORD: vientos
      POSTGRES_DB: vientos
    ports:
      # Host port is overridable: another project may already hold 5432.
      # Set POSTGRES_PORT in .env and keep DATABASE_URL in sync.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vientos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vientos -d vientos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vientos-pgdata:
